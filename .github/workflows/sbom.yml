name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate CycloneDX SBOM
    # Visibility-gated like the rest of the remote-CI surface.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        # The SHA-pinned dtolnay/rust-toolchain at this revision
        # requires an explicit toolchain input. `stable` here is a
        # baseline; rust-toolchain.toml at the repo root drives the
        # actual cargo invocations via rustup.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep cargo-cyclonedx's binary cached alongside the build
          # dependency graph so subsequent runs don't re-compile it.
          cache-targets: "false"
          key: sbom

      - name: Install cargo-cyclonedx
        # Pin a known-good version. Bump deliberately when CVEs or
        # SPEC-format updates land; do not float to latest.
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --override-filename bom
          # Produces ./bom.json at the workspace root for a single
          # crate; for workspaces it would also emit per-package files.
          ls -la bom.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: bom.json
          if-no-files-found: error
          retention-days: 90
