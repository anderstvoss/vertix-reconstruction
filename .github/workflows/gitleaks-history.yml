name: Gitleaks (full history)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: gitleaks-history-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    # Gated on public visibility along with the other remote-CI jobs;
    # while private, scripts/deep-scan.sh covers the same surface
    # locally. Auto-activates on public flip.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          # gitleaks-action downloads the gitleaks release binary from
          # GitHub release assets and uploads a report artifact on
          # findings; nothing else leaves the runner.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bring every branch and tag into the local clone so the
      # subsequent `--log-opts=--all` scan reaches them. Without this,
      # `actions/checkout` only materialises the triggering ref's
      # history.
      - name: Fetch all refs
        run: |
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      # Main-history scan via the official action (SHA-pinned install).
      - name: Gitleaks (main history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deep scan: same gitleaks binary now on PATH, called directly
      # with `--log-opts=--all` to walk every commit reachable from any
      # branch or tag. Closes the gap where un-merged side branches
      # could carry secrets that the main-only scan would miss.
      - name: Gitleaks (all refs)
        run: gitleaks detect --no-banner --log-opts='--all'
