[package]
name = "vertix_krp_desktop"
version = "0.1.0"
edition = "2024"
# time 0.3.47+ (via wry's cookie dependency, for RUSTSEC-2026-0009) needs 1.88.
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Desktop window for KRP's browser client: loads it from a reconstruction server and adds the reconstruction's input rate, sharp display and metrics at run time."
repository = "https://github.com/anderstvoss/vertix-reconstruction"
publish = false

[[bin]]
name = "vertix-krp-desktop"
path = "src/main.rs"

[dependencies]
# The system webview (WebView2, WKWebView, WebKitGTK) and its window, the
# libraries Tauri is built on.
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
