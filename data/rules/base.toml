# Base rule layer: a complete, PROVISIONAL starting set.
#
# Every number the server needs, so the game runs even with no dated
# evidence. Most values come from KrunkerRevivalProject/vertix (a 2026
# remake, commit 2d35f66): a non-authoritative later source, kept only
# until something better is found. Values are replaced by later layers
# (data/rules/2016-08-06.toml, then an optional local file), never edited
# here to "fix" history. See src/game/assumptions.rs for the format.
#
# Units follow the client: distances in world pixels, speeds in pixels per
# millisecond, times in milliseconds, angles in radians.

[layer]
status = "PROVISIONAL"
source = "KrunkerRevivalProject/vertix 2d35f66 (loadouts.ts, gamemodes.ts, game.ts)"

[world]
tile_scale = 256
max_screen_width = 1920
max_screen_height = 1080
view_mult = 1

[net]
status = "ASSUMED"
source = "our choice; research SERVER-CONTRACT 3: start at the client's default 30 fps"
# How often the server advances the world and sends "rsd" snapshots. The
# original rate is unknown. Other players snap to each snapshot with no
# interpolation, so this is visible in how they move.
update_hz = 30
# Movement is applied per input from the gap between the client's input
# timestamps, clamped to this so a stalled or hostile client cannot move
# further than the time allows.
max_input_delta_ms = 100

[round]
status = "ASSUMED"
source = "our choice: free for all first"
mode = "ffa"

[player]
spawn_protection_ms = 2000

