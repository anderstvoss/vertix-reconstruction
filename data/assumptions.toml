# Gameplay numbers the server needs and no first-party source gives.
#
# Every value here is an ASSUMPTION unless its line says RECOVERED. The
# original server held these numbers and was never published; the client
# only receives them. Most come from a third-party remake
# (KrunkerRevivalProject/vertix, 2026), used as a HYPOTHESIS, not as
# evidence. Replace values as the research repository resolves them
# (tools/stat_lookup.py --date 2016-08-06 --strict), and keep the source
# comment next to each changed value.
#
# Units follow the client: distances in world pixels, speeds in pixels per
# millisecond, times in milliseconds, angles in radians.

[world]
# Hypothesis (remake). Map pixels are scaled by this to world pixels.
tile_scale = 256
# The client's own defaults before the server overrides them (RECOVERED
# from app.js: maxScreenWidth 1920, maxScreenHeight 1080, viewMult 1).
max_screen_width = 1920
max_screen_height = 1080
view_mult = 1

[net]
# How often the server simulates and sends "rsd" snapshots. Unknown for the
# original server; 60 Hz matches the client's default frame cap when its
# FPS setting is 60. The client predicts its own movement, so this mainly
# affects how smooth other players look.
tick_ms = 16
# Movement is applied per input using the time between the client's input
# timestamps, clamped to this, so a stalled or hostile client cannot move
# further than the elapsed time allows.
max_input_delta_ms = 100

[mode]
# Free for All, the mode the menu lists third (RECOVERED: mode names from
# the page's create-server form). desc1/desc2 and the score limit are
# assumptions.
name = "Free for All"
code = "ffa"
desc1 = "Free For All"
desc2 = "Free For All"
score = 1500
teams = false

[player]
# Class order and loadouts are RECOVERED from the client; the per-class
# numbers below are hypotheses (remake).
spawn_protection_ms = 2000

