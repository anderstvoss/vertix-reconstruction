# Server settings. Relative paths are resolved from the directory the
# server is started in (the repository root).
#
# This is the only file that names a bind address; the template's
# loopback blocker in .pre-commit-config.yaml excludes this file alone.
bind = "127.0.0.1"
port = 8080

# Path to a vertix-archive clone with its LFS files pulled. The
# VERTIX_ARCHIVE environment variable or --archive override it.
archive = ""

manifest = "data/boot/20160806061006.json"

# Game rules, as layers merged in order (later layers win, value by value).
# Every value carries a status and source; `--explain-rules` lists them.
rules = ["data/rules/base.toml", "data/rules/2016-08-06.toml"]

# JSON-lines trace of every event; empty for none. --trace overrides it.
trace = ""
# Events traced by name only, because they fire every frame or tick.
trace_brief = ["rsd", "4", "0", "ping1", "pong1"]

[maps]
# Map sources, loaded in order; a later source replaces a map with the
# same id. Each mode plays the ids its `maps` list names (in the rule
# layers), so new maps need no code change: add the file, then the id.
# "archive": every map-<id>.genData.json in archive_dir of the archive
#   clone, each hash-checked against its sha256sums.txt (by default the 24
#   provisional KrunkerRevival candidates, never copied into this repository).
# "files": the text maps listed under files, keyed by file name, e.g. our
#   own placeholder arena.
sources = ["archive"]
archive_dir = "vertix-preservation/derived/maps/krp-2026-candidates"
files = ["data/maps/arena.txt"]

[engine_io]
# The values in the archived 2016 handshakes.
ping_interval_ms = 25000
ping_timeout_ms = 60000
