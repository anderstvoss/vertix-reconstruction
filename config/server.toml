# Server settings. Relative paths are resolved from the directory the
# server is started in (the repository root).
#
# This is the only file that names a bind address; the template's
# loopback blocker in .pre-commit-config.yaml excludes this file alone.
bind = "127.0.0.1"
port = 8080

# Path to a vertix-archive clone with its LFS files pulled. The
# VERTIX_ARCHIVE environment variable or --archive override it.
archive = ""

# The KrunkerRevival client, built by scripts/build-client.sh (or .ps1).
# Never committed; the server serves whatever this directory holds.
client_dir = "client/dist"

# Game rules, as layers merged in order (later layers win, value by value).
# Every value carries a status and source; `--explain-rules` lists them.
rules = ["data/rules/base.toml", "data/rules/recovered.toml"]

# JSON-lines trace of every event; empty for none. --trace overrides it.
trace = ""
# Events traced by name only, because they fire every frame or tick.
trace_brief = ["rsd", "4", "0", "ping1", "pong1"]

[maps]
# Map sources, loaded in order; a later source replaces a map with the
# same id. Each mode plays the ids its `maps` list names (in the rule
# layers), so new maps need no code change: add the file, then the id.
# "archive": every map-<id>.genData.json in archive_dir of the archive
#   clone, each hash-checked against its sha256sums.txt (by default the 24
#   provisional KrunkerRevival candidates, never copied into this repository).
# "files": the text maps listed under files, keyed by file name, e.g. our
#   own placeholder arena.
sources = ["archive"]
archive_dir = "vertix-preservation/derived/maps/krp-2026-candidates"
files = ["data/maps/arena.txt"]

[game]
# KrunkerRevival's classes, weapons, modes and cosmetics, converted by
# scripts/import_krp.py.
krp_data = "data/krp"
# Balance presets laid over KRP's numbers (see data/balance/README.md):
# "best" (default), "krp" (KRP's own numbers), or a game version such as
# "v3.8".
balance_dir = "data/balance"
balance = "best"

# Players per room. A room in the list below can set its own, e.g.
# { name = "DEV0", mode = "ffa", max_players = 12 }. The client's custom
# server form can lower a room's limit, never raise it.
max_players = 8

# The rooms opened at start, one per mode as in KRP's dev server. A client
# picks one in the server browser; mode codes are those in data/krp.
rooms = [
  { name = "DEV0", mode = "ffa" },
  { name = "DEV1", mode = "tdm" },
  { name = "DEV2", mode = "hp" },
  { name = "DEV3", mode = "lc" },
  { name = "DEV4", mode = "snipe" },
  { name = "DEV5", mode = "boss" },
  { name = "DEV6", mode = "zmtch" },
  { name = "DEV7", mode = "rckt" },
  { name = "DEV8", mode = "pyro" },
]

[classic]
# The archived 2016-08-06 client, kept as a compatibility path. It is
# served from the archive (never from this repository) on its own port,
# and its players join `room` (the first room if empty) through an event
# translation layer (src/classic/adapt.rs). Needs the archive.
enabled = true
port = 8081
room = ""
manifest = "data/boot/20160806061006.json"

[engine_io]
# Socket.IO's defaults, which KRP's server uses.
ping_interval_ms = 25000
ping_timeout_ms = 20000
