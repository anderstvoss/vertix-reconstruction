[package]
name = "vertix_reconstruction"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Compatibility server that lets the original 2016 Vertix.io browser client run against a local, reverse-engineered backend."
repository = "https://github.com/anderstvoss/vertix-reconstruction"
readme = "README.md"
keywords = ["vertix", "game-preservation", "socket-io", "reconstruction"]
categories = ["games"]

[[bin]]
name = "vertix-server"
path = "src/main.rs"

[dependencies]
# HTTP server for the page, the archived files and Engine.IO long-polling.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# Wire payloads are JSON; config and assumptions are TOML.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Every original file is checked against its recorded SHA-256 before use.
sha2 = "0.10"
# The APK is a zip; its members are read without unpacking it to disk.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Engine.IO session ids must not be guessable.
rand = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Keeps unsafe auditable if a crate later needs FFI and relaxes the
# forbid above to deny + per-crate allow.
undocumented_unsafe_blocks = "deny"
