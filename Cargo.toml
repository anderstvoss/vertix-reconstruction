[package]
name = "vertix_reconstruction"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Compatibility server that lets the original 2016 Vertix.io browser client run against a local, reverse-engineered backend."
repository = "https://github.com/anderstvoss/vertix-reconstruction"
readme = "README.md"
keywords = ["vertix", "game-preservation", "socket-io", "reconstruction"]
categories = ["games"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Keeps unsafe auditable if a crate later needs FFI and relaxes the
# forbid above to deny + per-crate allow.
undocumented_unsafe_blocks = "deny"
